name: Research repair regression checks
on:
  pull_request:
  push:
    branches: [fix/research-integrity-2026-09-09]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bipv_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: bipv_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bipv_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BIPV_TEST_DATABASE_URL: postgresql://bipv_test:disposable_test_only@localhost:5432/bipv_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
      - run: uv sync --locked --python 3.11
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: git diff --check
